<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#F7F6FB"/><rect x="0" y="0" width="390" height="42" rx="0" fill="#F7F6FB"/><text x="25" y="27.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#24243A">9:41</text><text x="294" y="27.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#24243A">|||  ~  []</text><text x="22" y="78.0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24243A">x</text><rect x="60" y="61" width="250" height="10" rx="8" fill="#e5e0f2"/><rect x="60" y="61" width="100" height="10" rx="8" fill="#6750EE"/><text x="332" y="73.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#6F7085">2/5</text><text x="22" y="111.0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#6750EE">DELTA LAKE · TIME TRAVEL</text><text x="22" y="151.0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#24243A">Does table history</text><text x="22" y="176.96" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#24243A">guarantee that old data is</text><text x="22" y="202.92" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#24243A">still available?</text><rect x="22" y="260" width="346" height="63" rx="15" fill="#DDF6EB" stroke="#137B60" stroke-width="1.5"/><rect x="34" y="277" width="27" height="28" rx="8" fill="#137B60"/><text x="42" y="296.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#fff">A</text><text x="73" y="287.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#24243A">No. Required files may be removed.</text><rect x="22" y="334" width="346" height="63" rx="15" fill="#FFF0EF" stroke="#E15D64" stroke-width="1.5"/><rect x="34" y="351" width="27" height="28" rx="8" fill="#E15D64"/><text x="42" y="370.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#fff">B</text><text x="73" y="361.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#24243A">Yes. History keeps every data file.</text><rect x="22" y="408" width="346" height="63" rx="15" fill="#fff" stroke="#E9E7F3" stroke-width="1.5"/><rect x="34" y="425" width="27" height="28" rx="8" fill="#F7F6FB"/><text x="42" y="444.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#6F7085">C</text><text x="73" y="435.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#24243A">Only if the table gets larger.</text><rect x="22" y="482" width="346" height="63" rx="15" fill="#fff" stroke="#E9E7F3" stroke-width="1.5"/><rect x="34" y="499" width="27" height="28" rx="8" fill="#F7F6FB"/><text x="42" y="518.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#6F7085">D</text><text x="73" y="509.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#24243A">Yes. Old versions last forever.</text><rect x="22" y="566" width="346" height="103" rx="17" fill="#FFF0EF"/><text x="37" y="591.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#B3424B">A useful one to review</text><text x="37" y="613.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#24243A">History is not a data archive. Cleanup can remove</text><text x="37" y="628.6" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#24243A">files an older version needs.</text><text x="37" y="655.0" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#6750EE">Read the documentation &gt;</text><rect x="22" y="686" width="346" height="47" rx="15" fill="#fff" stroke="#6750EE" stroke-width="1.5"/><text x="38" y="716.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#6750EE">Explain another way</text><rect x="22" y="752" width="346" height="47" rx="15" fill="#4D37CE"/><rect x="22" y="748" width="346" height="47" rx="15" fill="#6750EE"/><text x="38" y="778.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#fff">Got it — continue</text><rect x="144" y="832" width="102" height="4" rx="2" fill="#24243A"/></svg>